name: devsphere
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: devsphere
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env.compose first}
      POSTGRES_DB: devsphere
    ports:
      - "127.0.0.1:${DATABASE_PORT:-55434}:5432"
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devsphere -d devsphere"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8010}:8010"
    environment:
      DATABASE_URL: postgresql+psycopg://devsphere:${POSTGRES_PASSWORD}@db:5432/devsphere
      JWT_SECRET: ${JWT_SECRET:?Generate .env.compose first}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8010}
      SECURE_COOKIE: ${SECURE_COOKIE:-false}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      PROVIDER: ${PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      SANDBOX_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 10
  ollama:
    image: ollama/ollama:0.40.5
    profiles: [local-model]
    volumes:
      - models:/root/.ollama
volumes:
  database:
  models:
